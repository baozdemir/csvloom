<svg xmlns="http://www.w3.org/2000/svg" width="760" height="386" viewBox="0 0 760 386" role="img" aria-labelledby="title desc">
<title id="title">csvloom against Papa Parse in each of the 24 parse cases</title>
<desc id="desc">Grouped horizontal bar chart in two panels, 1 MiB and 32 MiB files. For each kind of CSV, how many times faster csvloom is than Papa Parse, with rows as arrays and as objects; Papa Parse is 1, and every bar is above it. 1 MiB files: simple 2.51 (arrays), 3.88 (objects); quote-heavy 4.55 (arrays), 4.55 (objects); multiline 3.62 (arrays), 4.44 (objects); wide 2.97 (arrays), 3.74 (objects); unicode 3.56 (arrays), 3.91 (objects); long-field 7.23 (arrays), 7.53 (objects). 32 MiB files: simple 1.23 (arrays), 1.79 (objects); quote-heavy 1.31 (arrays), 1.74 (objects); multiline 1.24 (arrays), 1.52 (objects); wide 1.10 (arrays), 2.36 (objects); unicode 1.23 (arrays), 1.67 (objects); long-field 2.64 (arrays), 2.44 (objects).</desc>
