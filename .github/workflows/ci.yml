# Correctness only: no benchmark, no browser, no publish step, no secret. The coverage report goes
# to Codecov through GitHub OIDC, not a token.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      matrix:
        node: ['22.23.4', '24.22.1', '26.13.1']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm ci
      - run: npm run check
      - run: npm run build
      # Checks 3, 12 and 15 of test:package run on this job's own Node; the three jobs together cover 22, 24 and 26.
      - run: CSVLOOM_NODE_BINARIES="$(command -v node)" npm run test:package

  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # the OIDC token of the Codecov upload
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - run: npm ci
      - run: >-
          npx vitest run --testTimeout=60000 --coverage.enabled --coverage.provider=v8
          --coverage.include='src/**' --coverage.reporter=lcov --coverage.reporter=text-summary
          --coverage.thresholds.statements=95 --coverage.thresholds.branches=90
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage/lcov.info
          disable_search: true
          use_oidc: true
          fail_ci_if_error: false

  macos:
    name: Node 24.22.1 on macOS
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: CSVLOOM_NODE_BINARIES="$(command -v node)" npm run test:package

  windows:
    name: Node 24.22.1 on Windows
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      # Every test but the benchmark harness's, which pins workers with taskset and reads /proc.
      - run: npx vitest run --testTimeout=30000 --exclude "test/bench*.test.ts"
      - run: npm run build
      - run: node scripts/examples-on.mjs node

  runtimes:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Deno 2.9.8
            runtime: deno
            command: deno run --allow-all
          - name: Bun 1.4.4
            runtime: bun
            command: bun
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - if: matrix.runtime == 'deno'
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: '2.9.8'
      - if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'
      - run: npm ci
      - run: npm run build
      # Every example of examples/, against the packed package, run by this runtime. The command is
      # split into words on purpose ("deno run --allow-all").
      - run: node scripts/examples-on.mjs $RUNTIME_COMMAND
        env:
          RUNTIME_COMMAND: ${{ matrix.command }}
